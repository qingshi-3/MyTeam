arahealer.png" alt="济世医师正式大小肖像"></a><figcaption>济世医师</figcaption></figure></div><h2>生成记录</h2><p>使用内置 imagegen 编辑背景。旧白底定稿保留，正式资源路径与原有读取方式不变。</p><nav><a href="replacement.json">来源、文件路径与检查记录</a></nav><details><summary>展开最初骑士白底／色底试稿对照</summary><div class="pair"><figure><figcaption>旧白底</figcaption><img src="runtime-white.png" alt="骑士旧白底"></figure><figure><figcaption>蓝灰底试稿</figcaption><img src="runtime-slate.png" alt="骑士蓝灰底试稿"></figure></div></details></main></html>
