<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>狐面双刃刺客 · 像素动画</title><style>
*{box-sizing:border-box}body{margin:0;background:#171c22;color:#e6e8ed;font:15px/1.6 system-ui,'Microsoft YaHei',sans-serif}main{max-width:1200px;margin:auto;padding:28px 24px}h1{font-size:26px;margin:0}p{color:#a8b4c1}.controls{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin:18px 0}button,select{font:inherit;color:inherit;background:#2a3542;border:1px solid #546276;border-radius:5px;padding:6px 12px;cursor:pointer}button[aria-pressed=true]{background:#8b303b;border-color:#dc8b96}button:focus-visible,select:focus-visible,input:focus-visible{outline:3px solid #ffd071;outline-offset:3px}.viewer{display:flex;gap:32px;flex-wrap:wrap;align-items:center}.stage{background:#445259;width:360px;height:340px;display:grid;place-items:center;border:1px solid #69757b}.stage.light{background:#e5e4df}canvas,img{image-rendering:pixelated}canvas{width:320px;height:320px;max-width:100%}.detail{min-width:260px}.frames{display:flex;flex-wrap:wrap;gap:6px}.frames img{width:80px;height:80px;background:#445259;border:1px solid transparent}.frames img.current{border-color:#ffd071}.all{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px;margin-top:28px}.all figure{margin:0;background:#222a34;padding:12px}.all img{width:160px;height:160px;display:block;margin:auto}.all figcaption{margin-top:6px}a{color:#edb46f}small{color:#a8b4c1}.status{font-variant-numeric:tabular-nums}footer{margin-top:28px}
</style></head><body><main><h1>狐面双刃刺客 · 像素动画</h1><p>36 帧 · 80 × 80 像素 · 透明背景 · 六组动作</p><nav id="actions" class="controls" aria-label="选择动作"></nav><div class="viewer"><div class="stage" id="stage"><canvas id="view" width="80" height="80" aria-label="当前动画预览"></canvas></div><div class="detail"><h2 id="name">待机</h2><p class="status" id="status"></p><div class="controls"><button id="play">暂停</button><button id="restart">重播</button><button id="prev">上一帧</button><button id="next">下一帧</button></div><div class="controls"><label>速度 <select id="speed"><option value="0.5">0.5×</option><option value="1" selected>1×</option><option value="2">2×</option></select></label><label><input type="checkbox" id="mirror">朝左</label><label><input type="checkbox" id="light">浅色背景</label></div><p><small>待机、疾跑循环；其余动作播放一次后停在末帧。</small></p><div class="frames" id="frames"></div></div></div><section class="all" id="all" aria-label="全部动作循环演示"></section><footer><a href="atlas.png">透明帧图集</a> · <a href="frames.tres">Godot SpriteFrames</a> · <a href="manifest.json">逐帧信息</a><p><small>GIF 是循环演示；游戏帧资源中的受击、攻击、技能和倒下均为单次播放。当前为独立美术资源，未替换现有单位。</small></p></footer></main>
<script>
const defs=[['idle','待机',7,true],['move','疾跑',10,true],['attack','双刃斩击',10,false],['skill_cast','突袭挑斩',10,false],['hit','受击',14,false],['defeated','倒下',8,false]];
const sheet=new Image();sheet.src='atlas.png';const ctx=document.querySelector('#view').getContext('2d');ctx.imageSmoothingEnabled=false;
let row=0,frame=0,playing=!matchMedia('(prefers-reduced-motion: reduce)').matches,elapsed=0,previous=0;
const $=s=>document.querySelector(s);
defs.forEach((d,i)=>{const b=document.createElement('button');b.textContent=d[1];b.onclick=()=>select(i);$('#actions').append(b);const f=document.createElement('figure');const im=document.createElement('img');im.src=matchMedia('(prefers-reduced-motion: reduce)').matches?`frames/${d[0]}/00.png`:`gifs/${d[0]}.gif`;im.alt=d[1]+'循环演示';f.append(im);const cap=document.createElement('figcaption');cap.textContent=d[1];f.append(cap);$('#all').append(f)});
function select(i){row=i;frame=0;elapsed=0;playing=!matchMedia('(prefers-reduced-motion: reduce)').matches;$('#name').textContent=defs[i][1];$('#frames').replaceChildren();for(let j=0;j<6;j++){let im=document.createElement('img');im.src=`frames/${defs[i][0]}/${String(j).padStart(2,'0')}.png`;im.alt=`${defs[i][1]}第${j+1}帧`;$('#frames').append(im)}[...$('#actions').children].forEach((b,n)=>b.setAttribute('aria-pressed',n===row));draw()}
function draw(){ctx.clearRect(0,0,80,80);ctx.save();if($('#mirror').checked){ctx.translate(80,0);ctx.scale(-1,1)}if(sheet.complete&&sheet.naturalWidth)ctx.drawImage(sheet,frame*80,row*80,80,80,0,0,80,80);ctx.restore();$('#status').textContent=`第 ${frame+1} / 6 帧 · ${defs[row][2]} FPS · ${playing?'播放中':'已暂停'}`;$('#play').textContent=playing?'暂停':'播放';[...$('#frames').children].forEach((im,i)=>im.classList.toggle('current',i===frame))}
function tick(t){let dt=previous?Math.min(t-previous,100):0;previous=t;if(playing){elapsed+=dt*Number($('#speed').value);let span=1000/defs[row][2];while(elapsed>=span){elapsed-=span;if(frame===5){if(defs[row][3])frame=0;else{playing=false;break}}else frame++}draw()}requestAnimationFrame(tick)}
$('#play').onclick=()=>{playing=!playing;if(playing&&frame===5&&!defs[row][3])frame=0;elapsed=0;draw()};$('#restart').onclick=()=>{frame=0;elapsed=0;playing=true;draw()};$('#prev').onclick=()=>{playing=false;frame=(frame+5)%6;draw()};$('#next').onclick=()=>{playing=false;frame=(frame+1)%6;draw()};$('#mirror').onchange=draw;$('#light').onchange=()=>$('#stage').classList.toggle('light',$('#light').checked);sheet.onload=draw;select(0);requestAnimationFrame(tick);
</script></body></html>
